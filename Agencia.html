<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container py-5">
    <div class="row g-4">

        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">

                    <h2 class="mb-4 text-primary">Contáctanos</h2>

                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control" placeholder="Ingresa tu nombre">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo</label>
                            <input type="email" class="form-control" placeholder="correo@ejemplo.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mensaje</label>
                            <textarea class="form-control" rows="5" placeholder="Escribe tu mensaje"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Enviar mensaje
                        </button>
                    </form>

                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow border-0 h-100">
                <div class="card-body p-4">

                    <h2 class="mb-4 text-primary">Información</h2>

                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item">
                            <strong>Empresa:</strong> Mi Empresa
                        </li>
                        <li class="list-group-item">
                            <strong>Teléfono:</strong> +57 300 123 4567
                        </li>
                        <li class="list-group-item">
                            <strong>Email:</strong> contacto@empresa.com
                        </li>
                        <li class="list-group-item">
                            <strong>Dirección:</strong> Bogotá, Colombia
                        </li>
                    </ul>

                    <iframe
                        src="https://maps.google.com/maps?q=Bogota&t=&z=13&ie=UTF8&iwloc=&output=embed"
                        width="100%"
                        height="300"
                        class="rounded shadow-sm"
                        style="border:0;">
                    </iframe>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
