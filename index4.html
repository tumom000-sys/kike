<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <form action="">
        <h2>Datos personales</h2>
        <label for=""> Nombre de usuario</label>
        <input type="text" id="NombreUsuario" name="nombre" placeholder="Ej: Juan Perez"> 
        <br> <br>
        <label for="CorreoUsuario"> Correo electronico </label>
        <input type="text" id="CorreoUsuario" name="email" placeholder="Correo@ejemplo.com" required>
    </form>

    <form action="">
        <h2> diferentes tipos de input </h2>
        <label for="pass"> contraseña: </label> 
        <input type="password" name="clave" id="pass">
        <br><br>
        <label for="edad">edad</label>
        <input type="number" id="edad" name="edad" min="18" max="99">
        <label for="nacimiento">fecha de nacimiento</label>
        <input type="date" name="fecha_nac" id="nacimiento">
        <br><br>
        <p> seleccione tu plan</p>
        <input type="radio" name="plan" id="plangratis" value="gratis">
        <label for="plangratis">plan gratis</label>
        <input type="radio" name="plan" id="planpro" value="pro">
        <label for="planpro">plan pro </label>
        <input type="radio" name="plan" id="planPremium" value="planPremium">
        <label for="planPremium">plan Premium</label>
        <br><br>
        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos"> Acepto terminos y condiciones</label>
        <button type="submit"> enviar formulario</button>
        <button type="reset">Limpiar formulario</button>
    </form>
    <form action="">
        <h2>textarea y select </h2>
        <label for="pais"¿De qué pais nos visitas?></label>
        <select name="pais" id="pais">
            <option value="">--SELECCIONE UN OPCION--</option>
            <option value="CO">colombia</option>
            <option value="PER">Perú </option>
            <option value="ARG">Argentina </option>
            <option value="BOV">Bolivia </option>
            <option value="MEX">Mexico </option>
            <option value="ECU">Ecuador</option>
            <br><br>
            <label for="mensaje">dejanos tu opinion</label>
            <br>
            
        </select>
    </form>

</body>
</html>
